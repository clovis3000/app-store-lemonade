[categories]
"6002" = "Utilities"
"6007" = "Productivity"
"6013" = "Health & Fitness"
"6015" = "Finance"
"6017" = "Education"
"6001" = "Weather"
"6006" = "Reference"
"6008" = "Photo & Video"

[scoring]
min_rating_count = 500
max_rating = 4.2
skip_developers = [
    "Apple",
    "Google LLC",
    "Google",
    "Meta Platforms, Inc.",
    "Microsoft Corporation",
    "Amazon",
    "Amazon.com",
]
skip_categories = ["Games"]
min_months_since_update = 0.0

[rate_limits]
rss_delay_ms = 1000
itunes_delay_ms = 3000
reviews_delay_ms = 3000

[paths]
db = "data/db/lemonade.db"
cache_dir = "data/cache"
prompts_dir = "prompts"

[llm]
# Where research calls go:
#   "anthropic"   Anthropic API, billed to ANTHROPIC_API_KEY
#   "claude-code" headless Claude Code (`claude -p`), billed to your Claude Pro/Max
#                 subscription; needs Claude Code installed and logged in
#   "openai"      OpenAI API, billed to OPENAI_API_KEY
# Override per run with --provider.
provider = "anthropic"
# Models follow the provider unless set here:
#   anthropic, claude-code: claude-haiku-5-5 (analysis), claude-opus-5-5 (synthesis)
#   openai:                 gpt-6-luna (both)
# analysis_model = "claude-haiku-5-5"
# synthesis_model = "claude-opus-5-5"
max_tokens = 16000
synthesis_max_tokens = 32000
synthesis_effort = "high"
# Review batches in flight at once.
concurrency = 4
